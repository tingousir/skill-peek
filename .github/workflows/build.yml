name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        # tag 构建时把版本号带进 exe；分支构建用默认版本
        run: .\build.ps1 -Version "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.1.0' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: SkillPeek
          path: |
            dist/SkillPeek.exe
            dist/SkillPeek.exe.sha256

      # 打 tag 时自动发 Release：exe + 校验文件
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            dist/SkillPeek.exe `
            dist/SkillPeek.exe.sha256 `
            --title "Skill Peek $tag" `
            --notes "见 [CHANGELOG.md](CHANGELOG.md)。下载 ``SkillPeek.exe`` 双击即可；校验方法见 README。"
